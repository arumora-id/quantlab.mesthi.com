# Same-origin proxy for Binance Futures public market data.
#
# Why: some networks block fapi.binance.com, so the browser shows "Failed to fetch".
# With this proxy the browser only talks to quantlab.mesthi.com; the server fetches from Binance.
# The app tries /api/binance first and falls back to Binance directly, so it works with or without it.
#
# Use: include these two blocks inside the existing `server { ... }` of quantlab.mesthi.com,
# then `sudo nginx -t && sudo systemctl reload nginx`.
# Exact-match locations win over the SPA `location /`, and only these two read-only endpoints are exposed.
#
# Check afterwards:
#   curl -s "https://quantlab.mesthi.com/api/binance/fapi/v1/klines?symbol=BTCUSDT&interval=1d&limit=2"
# It must return JSON. HTTP 451 "restricted location" means Binance refuses the server's country;
# then host the proxy in an allowed region (the app keeps working through the direct fallback).

location = /api/binance/fapi/v1/klines {
    limit_except GET { deny all; }
    proxy_pass https://fapi.binance.com/fapi/v1/klines;
    proxy_ssl_server_name on;
    proxy_set_header Host fapi.binance.com;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_connect_timeout 10s;
    proxy_read_timeout 20s;
}

location = /api/binance/fapi/v1/exchangeInfo {
    limit_except GET { deny all; }
    proxy_pass https://fapi.binance.com/fapi/v1/exchangeInfo;
    proxy_ssl_server_name on;
    proxy_set_header Host fapi.binance.com;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_connect_timeout 10s;
    proxy_read_timeout 20s;
}
